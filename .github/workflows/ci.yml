name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - "release/**"
    # ready_for_review lets coverage run when a fork draft PR is marked ready.
    # For same-repo branches CI runs on the push event, where draft state is
    # resolved by the check-draft job below.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CONSUL_VERSION: 1.22.3
  TERRAFORM_VERSION: 1.14.3
  VAULT_VERSION: 1.21.2
  GO_VERSION: 1.26.0

jobs:
  run-check:
    name: Run-Check
    runs-on: ubuntu-latest
    # This job only runs if the action trigger is manual, a commit push, a PR from a different repo (fork),
    # or when a PR is marked as ready for review (ready_for_review event).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review')
    steps:
      - run: |
          echo "Run-check job ran successfully"

  # Resolves whether the current PR is a draft, for both event models this repo
  # uses: pull_request events (fork PRs) expose the draft flag directly, while
  # same-repo branches run on the push event and must look the PR up by commit.
  # The coverage report/gate jobs skip when this returns 'true'. Fails open
  # (treats as not-draft) so a lookup failure never silently bypasses the gate.
  check-draft:
    name: Check draft status
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      is-draft: ${{ steps.check.outputs.is-draft }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "is-draft=${PR_DRAFT:-false}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push / workflow_dispatch: no PR context, so find the open PR whose
          # head is this commit and read its draft flag.
          is_draft=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq 'map(select(.state == "open")) | (.[0].draft // false) | tostring' 2>/dev/null || echo "false")
          echo "is-draft=${is_draft:-false}" >> "$GITHUB_OUTPUT"

  get-go-version:
    name: Get Go Version
    runs-on: ubuntu-latest
    needs: [run-check]
    if: needs.run-check.result == 'success'
    outputs:
      go-version: ${{ steps.get.outputs.go-version }}
    steps:
      - id: get
        run: echo "go-version=${{ env.GO_VERSION }}" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs:
      - run-check
    if: needs.run-check.result == 'success'
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go checks
        run: |
          make go-fmt-check

      - name: Run Terraform checks
        run: |
          make terraform-fmt-check

      - name: Compile weekly tests
        run: |
          make compile-weekly-tests

      - name: Verify go.mod and go.sum are correct
        run: |
          go mod tidy
          git diff --quiet && exit 0
          echo "please run 'go mod tidy' to ensure go.mod and go.sum are up to date"
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - run-check
    if: needs.run-check.result == 'success'
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: |
          go build -ldflags "-w -s"

  unit-and-integration:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs:
      - run-check
    if: needs.run-check.result == 'success'
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup gotestsum
        uses: ./.github/actions/setup-gotestsum

      - name: Setup Consul
        uses: ./.github/actions/setup-consul
        with:
          version: ${{ env.CONSUL_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run unit and integration tests
        run: |
          make test-unit-and-integration

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: cts-coverage
          path: coverage.txt
          retention-days: 3

      - name: Annotate tests
        if: always()
        uses: guyarb/golang-test-annotations@2941118d7ef622b1b3771d1ff6eae9e90659eb26 # v0.8.0
        with:
          test-results: .build/test-results.json

  e2e-split:
    name: E2E Tests Splitting
    runs-on: ubuntu-latest
    needs:
      - run-check
    if: needs.run-check.result == 'success'
    env:
      E2E_TESTS_PARALLELISM: 4
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Split E2E tests
        run: |
          set -euo pipefail
          ./build-scripts/list-tests.sh e2e ./e2e | ./build-scripts/split-lines.sh ${{ env.E2E_TESTS_PARALLELISM }} .build/tests

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: e2e-tests-parts
          path: .build/tests/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - run-check
      - e2e-split
    if: needs.run-check.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup gotestsum
        uses: ./.github/actions/setup-gotestsum

      - name: Setup Consul
        uses: ./.github/actions/setup-consul
        with:
          version: ${{ env.CONSUL_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Move Terraform to work directory
        run: |
          # TERRAFORM_CLI_PATH is provided as an output of the setup-terraform action
          cp ${{ env.TERRAFORM_CLI_PATH }}/terraform ./e2e/

      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: e2e-tests-parts
          path: .build/tests/

      - name: Run E2E tests
        run: |
          set -euo pipefail
          cat .build/tests/part.${{ matrix.index }} | ./build-scripts/make-tests-regex.sh > .build/regex
          TESTS_REGEX_PATH=.build/regex make test-e2e-ci

      - name: Annotate tests
        if: always()
        uses: guyarb/golang-test-annotations@2941118d7ef622b1b3771d1ff6eae9e90659eb26 # v0.8.0
        with:
          test-results: .build/test-results.json

  coverage-report:
    name: Coverage Report
    needs:
      - run-check
      - get-go-version
      - unit-and-integration
      - check-draft
    # Skip coverage reporting/gating on draft PRs; it runs once marked ready.
    if: ${{ !cancelled() && needs.run-check.result == 'success' && needs.unit-and-integration.result != 'skipped' && needs.check-draft.outputs.is-draft != 'true' }}
    uses: ./.github/workflows/reusable-coverage-report.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      go-version: ${{ needs.get-go-version.outputs.go-version }}
      pr-number: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.number) || '' }}

  coverage-gate:
    name: Coverage Gate
    needs: [coverage-report]
    # Patch coverage measures the lines a PR adds/modifies. This repo validates
    # same-repo PRs through the `push` event (the `pull_request` run is skipped
    # for non-fork branches via run-check), so the gate must NOT be limited to
    # `pull_request` events. The coverage-report job resolves the open PR for
    # the pushed branch and computes patch coverage; when there is no open PR
    # (e.g. push to main), the patch output is empty and the gate passes as
    # N/A. Only gate when the report succeeded.
    if: ${{ !cancelled() && needs.coverage-report.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Minimum required coverage of the lines a PR adds/modifies (patch
      # coverage). New/changed code must be at least this well tested.
      PATCH_THRESHOLD: "90"
    steps:
      - name: Enforce patch coverage threshold
        env:
          PATCH: ${{ needs.coverage-report.outputs.patch }}
          COVERED: ${{ needs.coverage-report.outputs.patch_covered }}
          COVERABLE: ${{ needs.coverage-report.outputs.patch_coverable }}
        run: |
          set -euo pipefail

          echo "Patch coverage:     ${PATCH:-<empty>}"
          echo "Required threshold: ${PATCH_THRESHOLD}%"
          echo "Changed lines:      ${COVERED:-0}/${COVERABLE:-0} covered"

          # No coverable Go lines changed (docs/test-only) -> nothing to gate.
          if [ -z "${PATCH}" ] || [ "${PATCH}" = "N/A" ]; then
            echo "::notice::No coverable Go lines changed in this PR; patch-coverage gate skipped."
            {
              echo "### ✅ Coverage gate passed"
              echo ""
              echo "No coverable Go lines changed in this PR, so there is nothing to gate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if awk -v covered="${COVERED}" -v coverable="${COVERABLE}" -v threshold="${PATCH_THRESHOLD}" 'BEGIN { exit !(covered*100 >= threshold*coverable) }'; then
            echo "::notice::Patch coverage ${PATCH} meets the ${PATCH_THRESHOLD}% threshold."
            {
              echo "### ✅ Coverage gate passed"
              echo ""
              echo "Patch coverage **${PATCH}** (${COVERED}/${COVERABLE} changed lines) ≥ required **${PATCH_THRESHOLD}%**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Patch coverage ${PATCH} is below the required ${PATCH_THRESHOLD}% threshold."
            {
              echo "### ❌ Coverage gate failed"
              echo ""
              echo "Patch coverage **${PATCH}** (${COVERED}/${COVERABLE} changed lines) is below the required **${PATCH_THRESHOLD}%** threshold."
              echo ""
              echo "The lines this PR adds or modifies are not sufficiently covered by tests."
              echo "Add tests for the new/changed code, or adjust \`PATCH_THRESHOLD\` in \`.github/workflows/ci.yml\` (with reviewer sign-off)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  coverage-regression-gate:
    name: Coverage Regression Gate
    needs: [coverage-report]
    # Fails a PR into main if any package's average coverage drops more than
    # REGRESSION_TOLERANCE points below the baseline published from main to the
    # `badges` branch. Like coverage-gate it runs on the push event for
    # same-repo PRs (see run-check). Runs with no open PR (e.g. pushes to main)
    # and PRs into other branches (release/**) are skipped: the baseline only
    # describes main.
    if: ${{ !cancelled() && needs.coverage-report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Allowed per-package drop in percentage points. Identical code on main
      # has varied by up to 0.9 points between runs (timing-dependent paths),
      # so a strict comparison would fail PRs at random.
      REGRESSION_TOLERANCE: "1.0"
    steps:
      - name: Decide whether to gate
        id: scope
        env:
          TOTAL: ${{ needs.coverage-report.outputs.total }}
          PR: ${{ needs.coverage-report.outputs.pr-number }}
          PR_BASE: ${{ needs.coverage-report.outputs.pr-base }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1"
            printf '### ✅ Coverage regression gate skipped\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$PR" ] || skip "No open pull request for this run; nothing to compare."
          if [ -z "$PR_BASE" ]; then
            echo "::error::Could not determine the base branch of PR #${PR}. Failing closed; re-run the job."
            exit 1
          fi
          [ "$PR_BASE" = "main" ] || skip "PR #${PR} targets '${PR_BASE}'; the baseline only describes main."
          [ "${TOTAL:-N/A}" != "N/A" ] || skip "No coverage data was produced, so there is nothing to compare."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Download pkg-summary artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: pkg-summary
          path: .

      - name: Enforce per-package coverage regression gate
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read the baseline from the badges branch rather than the PR checkout
          # so a PR can neither edit nor go stale against it.
          BASELINE="$RUNNER_TEMP/coverage-baseline.txt"
          if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/${REPO}/contents/coverage-baseline.txt?ref=badges" > "$BASELINE" 2> "$RUNNER_TEMP/gh-err.txt"; then
            if grep -q "HTTP 404" "$RUNNER_TEMP/gh-err.txt"; then
              echo "::notice::No coverage baseline on the badges branch yet; it is published by the next CI run on main."
              printf '### ✅ Coverage regression gate skipped\n\nNo baseline published yet. It is created by the next CI run on `main`.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/gh-err.txt"
            echo "::error::Failed to fetch the coverage baseline. Failing closed; re-run the job."
            exit 1
          fi

          FAILED=0
          TABLE_ROWS=""
          while read -r pkg pr_pct _; do
            [ -n "$pkg" ] || continue
            pr_pct="${pr_pct%\%}"
            base_pct=$(awk -v p="$pkg" '$1 == p { v = $2; sub(/%$/, "", v); print v; exit }' "$BASELINE")
            if [ -z "$base_pct" ]; then
              TABLE_ROWS="${TABLE_ROWS}| \`${pkg}\` | N/A (new) | ${pr_pct}% | — | ✅ new package |\n"
              continue
            fi
            delta=$(awk -v a="$pr_pct" -v b="$base_pct" 'BEGIN { printf "%+.1f", a - b }')
            if awk -v a="$pr_pct" -v b="$base_pct" -v t="$REGRESSION_TOLERANCE" 'BEGIN { exit !(b - a > t + 1e-9) }'; then
              TABLE_ROWS="${TABLE_ROWS}| \`${pkg}\` | ${base_pct}% | ${pr_pct}% | ${delta} | ❌ REGRESSED |\n"
              echo "::error::Package '${pkg}' coverage dropped from ${base_pct}% to ${pr_pct}% (${delta}), more than the allowed ${REGRESSION_TOLERANCE} points."
              FAILED=1
            else
              TABLE_ROWS="${TABLE_ROWS}| \`${pkg}\` | ${base_pct}% | ${pr_pct}% | ${delta} | ✅ OK |\n"
            fi
          done < pkg-summary.txt

          {
            if [ "$FAILED" -eq 1 ]; then
              echo "### ❌ Coverage regression gate failed"
              echo ""
              echo "One or more packages dropped more than ${REGRESSION_TOLERANCE} points below the \`main\` baseline."
              echo "Add or restore tests to bring these packages back up."
            else
              echo "### ✅ Coverage regression gate passed"
              echo ""
              echo "No package dropped more than ${REGRESSION_TOLERANCE} points below the \`main\` baseline."
            fi
            echo ""
            echo "| Package | Baseline | PR | Delta | Status |"
            echo "|---------|----------|----|-------|--------|"
            printf "%b" "$TABLE_ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$FAILED"

  slack-notification:
    name: Slack Notification
    if: |
      needs.run-check.result == 'success' &&
      failure() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release'))
    needs:
      - run-check
      - checks
      - build
      - unit-and-integration
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@68bf00d0dbdbcb206c278399aa1ef6c14f74347a # v1.3.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
